# Publishes the site to GitHub Pages, and pulls the Sponsors / Fundraisers /
# Community Service cards from Google Drive.
#
#   - every push to master      -> publish the site
#   - every morning (6 AM EDT)  -> sync from Drive, then publish
#   - "Run workflow" button     -> sync from Drive now, then publish
#     (Actions tab -> "Sync & publish site" -> Run workflow)

name: Sync & publish site

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC = 6 AM EDT / 5 AM EST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Pull cards from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
        run: python scripts/sync_content.py

      - name: Save changes
        run: |
          git add js/content.json assets/content
          if git diff --cached --quiet; then
            echo "Nothing changed in Drive."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync cards from Google Drive"
            git push
          fi

  deploy:
    needs: sync
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master  # includes the sync commit, if one was just made

      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html css js assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
