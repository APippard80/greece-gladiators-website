# Publishes the site to GitHub Pages, and pulls the Sponsors / Fundraisers /
# Community Service cards from Google Drive.
#
#   - every push to master      -> publish the site
#   - four times a day          -> sync from Drive; publish only if something changed
#     (GitHub starts scheduled runs late - often by hours - so several runs a
#      day keep new Drive cards from waiting until the next day)
#   - "Run workflow" button     -> sync from Drive now, then publish
#     (Actions tab -> "Sync & publish site" -> Run workflow)
#     Tick "Test run only" to see what Drive has without changing the site.

name: Sync & publish site

on:
  push:
    branches: [master]
  schedule:
    # Off the top of the hour, when GitHub's queue is busiest.
    # 04:23 / 10:23 / 16:23 / 22:23 UTC = 12:23 AM, 6:23 AM, 12:23 PM, 6:23 PM EDT
    - cron: "23 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run only (read Drive, don't change the site)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Pull cards from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$DRIVE_ROOT_FOLDER_ID" ]; then
            echo "::notice::Google Drive sync isn't set up yet - skipping."
            exit 0
          fi
          python scripts/sync_content.py
          echo "Cards found:"
          python -c "import json; d=json.load(open('js/content.json', encoding='utf-8')); [print(f'  {k}: ' + (', '.join(i['title'] + ' [' + (i['status'] or '-') + ']' for i in d[k]) or '(none)')) for k in ('sponsors', 'fundraisers', 'communityService')]; print('  sponsor flyer: ' + ('yes' if d['sponsorFlyer'] else 'no'))"

      - name: Save changes
        id: save
        if: ${{ !inputs.dry_run }}
        run: |
          git add -A js/content.json assets
          if git diff --cached --quiet; then
            echo "Nothing changed in Drive."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync cards from Google Drive"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    # Pushes and manual runs always publish; scheduled runs only when Drive changed.
    if: >-
      always() && !inputs.dry_run &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped') &&
      (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master  # includes the sync commit, if one was just made

      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html css js assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
